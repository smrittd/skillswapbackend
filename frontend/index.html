<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap | Обмен навыками</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#4f46e5', secondary: '#10b981' } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800 pb-20">

    <nav class="bg-white shadow-sm border-b border-gray-100 mb-8 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-2xl font-bold text-primary flex items-center gap-2">
                🚀 SkillSwap
            </div>
            <button id="logout-btn" class="hidden text-sm bg-red-50 text-red-600 px-4 py-2 rounded-lg hover:bg-red-100 font-medium transition-colors">
                Выйти из аккаунта
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4">
        
        <div id="auth-section" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
            <div class="flex bg-gray-100 p-1 rounded-lg mb-6">
                <button id="tab-login" class="flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow text-gray-800 transition-all">Вход</button>
                <button id="tab-register" class="flex-1 py-2 text-sm font-semibold rounded-md text-gray-500 hover:text-gray-800 transition-all">Регистрация</button>
            </div>

            <div id="auth-error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 text-center"></div>
            <div id="auth-success" class="hidden mb-4 p-3 bg-green-50 text-green-700 text-sm rounded-lg border border-green-100 text-center"></div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
                    <input type="text" id="login-username" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                    <input type="password" id="login-password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none" required>
                </div>
                <button type="submit" class="w-full bg-primary text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition-colors shadow-md mt-4">
                    Войти
                </button>
            </form>

            <form id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="reg-email" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="mail@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
                    <input type="text" id="reg-username" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                    <input type="password" id="reg-password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none" required>
                </div>
                <button type="submit" class="w-full bg-secondary text-white font-semibold py-2.5 rounded-lg hover:bg-emerald-600 transition-colors shadow-md mt-4">
                    Создать аккаунт
                </button>
            </form>
        </div>

        <div id="dashboard-section" class="hidden">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-6 rounded-2xl shadow-lg text-white col-span-1 h-fit">
                    <h2 class="text-xl font-bold mb-1">Привет, <span id="display-username" class="text-indigo-100">...</span>! 👋</h2>
                    <p id="display-email" class="text-sm text-indigo-200 mb-4">...</p>
                    <div class="bg-white/20 p-3 rounded-lg backdrop-blur-sm text-sm">
                        Здесь ты можешь делиться своими знаниями и находить наставников.
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 col-span-1 md:col-span-2">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">✨ Добавить свой навык</h3>
                    <form id="create-skill-form" class="space-y-4">
                        <div>
                            <input type="text" id="skill-title" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary outline-none" placeholder="Название (например: Python, Игра на гитаре)" required>
                        </div>
                        <div>
                            <textarea id="skill-desc" rows="2" class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-primary outline-none resize-none" placeholder="Краткое описание того, чему ты можешь научить..."></textarea>
                        </div>
                        <button type="submit" class="bg-gray-900 text-white px-6 py-2 rounded-lg font-medium hover:bg-black transition-colors shadow-sm">
                            Опубликовать
                        </button>
                    </form>
                </div>
            </div>

            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h3 class="text-2xl font-bold text-gray-800">Лента навыков</h3>
                <div class="relative w-full md:w-96">
                    <input type="text" id="search-input" class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary outline-none shadow-sm" placeholder="Поиск по названию или описанию...">
                    <span class="absolute left-3 top-3 text-gray-400">🔍</span>
                </div>
            </div>

            <div id="skills-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>

        </div>

    </main>

    <script src="/static/app.js"></script>
</body>
</html>
