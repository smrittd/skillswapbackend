<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap | Обмен навыками</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#4f46e5' } }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <nav class="bg-white shadow-sm border-b border-gray-100 mb-10">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-2xl font-bold text-primary">🚀 SkillSwap</div>
            <button id="logout-btn" class="hidden text-sm text-gray-600 hover:text-red-500 font-medium transition-colors">
                Выйти
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4">
        
        <div id="auth-section" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
            <h2 class="text-2xl font-bold text-center mb-6">Вход в систему</h2>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary outline-none" required>
                </div>
                <button type="submit" class="w-full bg-primary text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition-colors shadow-md mt-4">
                    Войти
                </button>
            </form>

            <div id="auth-error" class="hidden mt-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 text-center"></div>
        </div>

        <div id="dashboard-section" class="hidden max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-100 text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">Успешный вход! 🎉</h2>
            <p class="text-gray-600 mb-6">Токен получен и сохранен в памяти браузера.</p>
            
            <div class="bg-gray-50 p-4 rounded-lg text-left overflow-x-auto border border-gray-200">
                <span class="text-sm font-bold text-gray-500 block mb-2">Твой профиль с бэкенда:</span>
                <pre id="user-profile-data" class="text-sm text-green-700 font-mono"></pre>
            </div>
        </div>

    </main>

    <script src="/static/app.js"></script>
</body>
</html>
